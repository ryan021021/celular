# servidor 24/7 (projeto celular) - so chave, sessoes mortas caem em 3 min
# Instalado pelo setup.sh em $PREFIX/etc/ssh/sshd_config.d/10-servidor.conf
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 60
ClientAliveCountMax 3

# So IPv4: o A13 tem IPv6 publico (2a0d:...) e o roteador pode nao bloquear entrada.
# Acesso remoto seguro sera pelo Tailscale (100.x, IPv4).
AddressFamily inet
ListenAddress 0.0.0.0:8022
